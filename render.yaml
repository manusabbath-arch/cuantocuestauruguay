databases:
  - name: preciosregulados-db
    plan: free
    region: ohio  # Adjust if needed: oregon, ohio, singapore, etc

services:
  - type: web
    name: preciosregulados-api
    env: docker
    plan: free
    region: ohio  # Match database region for best performance
    autoDeploy: true
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preciosregulados-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: PROJECT_NAME
        value: PreciosRegulados.uy
      - key: CKAN_API_URL
        value: https://catalogodatos.gub.uy/api/3/action
      - key: CKAN_COMBUSTIBLES_RESOURCE_ID
        value: 62bacbab-9bae-4316-af56-7c1bf468f546
      - key: ETL_SCHEDULE_HOUR
        value: "2"
      - key: ETL_SCHEDULE_MINUTE
        value: "0"
      - key: CORS_ORIGINS
        value: https://cuantocuestauruguay.com,https://www.cuantocuestauruguay.com
      - key: FRONTEND_URL
        value: https://cuantocuestauruguay.com
      - key: SENTRY_DSN
        sync: false
